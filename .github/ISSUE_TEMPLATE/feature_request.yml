name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first, then the proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and scope.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: context
    attributes:
      label: Additional context

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and requests.
          required: true
        - label: I have not included secrets or private data.
          required: true
